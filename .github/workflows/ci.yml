name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "以下文件需要 gofmt："; echo "$out"; exit 1; fi
      - name: 检查零第三方依赖
        run: |
          if grep -q '^require' go.mod; then echo "go.mod 中出现了第三方依赖"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        env:
          GOAGENT_NO_CLAUDE_SETTINGS: "1"
        run: go test -race -coverprofile=coverage.out ./...
      - name: 覆盖率
        run: go tool cover -func=coverage.out | tail -1

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
          go vet ./...
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o "dist/goagent-${GOOS}-${GOARCH}${ext}" ./cmd/goagent
          go build ./examples/...
      - uses: actions/upload-artifact@v4
        with:
          name: goagent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
